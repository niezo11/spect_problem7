<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenThumb | Plant Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body { background-color: #f2f3f1d0; }
    .plant-card { transition: transform 0.2s; border: none; }
    .plant-card:hover { transform: translateY(-5px); }
    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  </style>
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#"><i class="bi bi-leaf"></i> GreenThumb</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" href="#">Dashboard</a>
        </li>
 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle btn btn-light text-success ms-lg-2 px-3" href="#" data-bs-toggle="dropdown">
            + Quick Add
          </a>
          <div class="dropdown-menu dropdown-menu-end p-3 shadow border-0" style="width: 280px;">
            <h6 class="dropdown-header px-0">New Plant Details</h6>
            <input type="text" id="dropdown-name" class="form-control form-control-sm mb-2" placeholder="Name">
            <input type="number" id="dropdown-frequency" class="form-control form-control-sm mb-2" placeholder="Days between watering">
            <input type="date" id="dropdown-lastWatered" class="form-control form-control-sm mb-3">
            <button class="btn btn-success btn-sm w-100" onclick="addFromDropdown()">Add Plant</button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <header class="text-center mb-5">
    <h1 class="display-4 hero-title fw-bold">
  🌿 Plant Hydration Tracker
</h1>
<p class="text-muted fs-5">
  Keep your plants healthy and never miss watering day.
</p>
  </header>


  <div class="row justify-content-center mb-5">
    <div class="col-lg-10">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form id="plantForm" class="row g-3 align-items-end">
            <div class="col-md-4">
              <label class="form-label small fw-bold">Plant Name</label>
              <input type="text" id="name" class="form-control" placeholder="e.g. Monstera" required>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Frequency (Days)</label>
              <div class="input-group">
                <input type="number" id="frequency" class="form-control" placeholder="7" required>
                <span class="input-group-text">days</span>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Last Watered</label>
              <input type="date" id="lastWatered" class="form-control" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-success w-100">Add Plant</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>


  <div id="plantList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div id="reminderSection" class="mb-4"></div>

<div id="plantList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
</div>
   
    <div class="col-12 text-center text-muted">
      <i class="bi bi-droplets" style="font-size: 3rem;"></i>
      <p>No plants tracked yet. Add one above!</p>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
